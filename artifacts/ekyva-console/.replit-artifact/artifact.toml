kind = "web"
previewPath = "/"
title = "EKYVA AI Console"
description = "A production-minded control center for one-wallet access to routed AI capabilities, including usage, wallet credits, API keys, model discovery, and routing mode controls."
version = "1.0.0"
id = "artifacts/ekyva-console"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21919

[services.development]
run = "pnpm --filter @workspace/ekyva-console run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ekyva-console", "run", "build" ]
serve = "static"
publicDir = "artifacts/ekyva-console/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21919"
BASE_PATH = "/"
