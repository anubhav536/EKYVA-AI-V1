services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ekyva
      POSTGRES_USER: ekyva
      POSTGRES_PASSWORD: ekyva
    ports:
      - "5432:5432"
    volumes:
      - ekyva-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      NODE_ENV: development
      PORT: 8080
      DATABASE_URL: postgresql://ekyva:ekyva@postgres:5432/ekyva
      REDIS_URL: redis://redis:6379
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      - postgres
      - redis
    ports:
      - "8080:8080"

volumes:
  ekyva-postgres: